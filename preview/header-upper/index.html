<html lang="ja" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Astera Header確認</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif}
    .header-upper{height:46px;border-bottom:1px solid rgba(255,255,255,.12);background:#020304}
    .header-upper-shell{width:100%;max-width:1240px;height:100%;margin:auto;padding:0 16px;display:flex;align-items:center;gap:8px}
    .brand{display:flex;align-items:center;min-width:0;text-decoration:none}
    .brand img{display:block;width:clamp(128px,13vw,180px);height:auto;max-height:30px;object-fit:contain;object-position:left center}
    .language-select-field{position:relative;display:inline-flex;align-items:center;width:54px;min-width:54px;margin-left:auto}
    .language-select{width:100%;min-height:30px;appearance:none;padding:2px 20px 2px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#050708;color:#fff;font:inherit;font-size:11px;font-weight:700;cursor:pointer;text-align:left}
    .language-select:focus-visible{outline:2px solid #7be5ec;outline-offset:2px}
    .language-select option{background:#050708;color:#fff}.language-select option:disabled{color:#747d82}
    .language-select-arrow{position:absolute;right:7px;top:50%;translate:0 -55%;color:#7be5ec;font-size:11px;pointer-events:none}
    main{min-height:calc(100dvh - 46px);background:#000}
    @media(max-width:599px){
      .header-upper{height:42px}
      .header-upper-shell{padding-inline:12px;gap:6px}
      .brand img{width:120px;max-height:28px}
      .language-select-field{width:50px;min-width:50px}
      .language-select{min-height:28px;padding:2px 18px 2px 7px;font-size:10px}
      .language-select-arrow{right:6px;font-size:10px}
      main{min-height:calc(100dvh - 42px)}
    }
  </style>
</head>

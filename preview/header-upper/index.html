<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Astera Header確認</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif}
    .header-upper{height:56px;border-bottom:1px solid rgba(255,255,255,.12);background:#020304}
    .header-upper-shell{width:min(calc(100% - 32px),1240px);height:100%;margin:auto;display:flex;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;text-decoration:none;min-width:0}
    .brand img{display:block;width:clamp(132px,18vw,190px);height:auto;max-height:34px;object-fit:contain;object-position:left center}
    .language-select-field{position:relative;display:inline-flex;align-items:center;min-width:128px;margin-left:auto}
    .language-select{width:100%;min-height:34px;appearance:none;padding:4px 32px 4px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#050708;color:#fff;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
    .language-select:focus-visible{outline:2px solid #7be5ec;outline-offset:2px}
    .language-select option{background:#050708;color:#fff}
    .language-select option:disabled{color:#747d82}
    .language-select-arrow{position:absolute;right:12px;top:50%;translate:0 -55%;color:#7be5ec;pointer-events:none}
    main{min-height:calc(100dvh - 56px);background:#000}
    @media(max-width:599px){
      .header-upper{height:52px}
      .header-upper-shell{width:calc(100% - 24px);gap:12px}
      .brand img{width:128px;max-height:30px}
      .language-select-field{min-width:116px}
      .language-select{min-height:32px;font-size:12px;padding-right:28px}
      main{min-height:calc(100dvh - 52px)}
    }
  </style>
</head>

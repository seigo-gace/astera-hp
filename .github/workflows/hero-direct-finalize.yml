# trigger: 2026-08-08T19:24+09:00
name: Finalize direct TOP hero replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-direct-finalize.yml'

permissions:
  contents: write

concurrency:
  group: astera-top-hero-direct-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Place exact uploaded PNG in dedicated image folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/hero verification
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-930c-8206-82a4-81139dfb6fdb/raw?se=2026-08-08T10%3A27%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=019fe0d3-54b7-7421-97b4-c34a173ea969&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T02%3A41%3A25Z&ske=2026-08-09T02%3A41%3A25Z&sks=b&skv=2026-02-06&sig=hq67N3Z/P2P4tWf0j0wCA%2BoAV/Tv%2BSSOXH1nRIzAwB0%3D' \
            -o assets/images/hero/astera-astrolabe.png
          test "$(wc -c < assets/images/hero/astera-astrolabe.png | tr -d ' ')" = '2736491'
          test "$(sha256sum assets/images/hero/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('assets/images/hero/astera-astrolabe.png').read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          PY

      - name: Point index to dedicated image folder and set custom-domain source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './assets/visual/hero/astera-astrolabe.png'
          new = './assets/images/hero/astera-astrolabe.png'
          if old not in s and new not in s:
              raise SystemExit('hero img source not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          printf 'asterav8.jp\n' > CNAME
          cat > verification/hero-asset.json <<'EOF'
          {
            "status": "PASS",
            "source": "Master-selected uploaded PNG",
            "path": "assets/images/hero/astera-astrolabe.png",
            "format": "PNG",
            "width": 1024,
            "height": 1024,
            "bytes": 2736491,
            "sha256": "ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc",
            "custom_domain_source": "asterav8.jp"
          }
          EOF

      - name: Remove superseded Hero and failed transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/visual/hero/astera-original-transparent.svg
          rm -f assets/visual/hero/astera-astrolabe.png
          rm -f assets/visual/hero/astera-astrolabe.webp
          rm -f assets/visual/hero/astera-astrolabe.avif
          rm -rf assets/visual/hero/.staging .hero-transfer .hero18
          rm -f .github/workflows/hero-bootstrap.yml
          rm -f .github/workflows/hero-fetch.yml
          rm -f .github/workflows/hero-binary-once.yml
          rm -f .github/workflows/hero-finalize.yml
          rm -f verification/hero-fetch-trigger.json
          rm -f verification/hero-finalize-trigger.json
          rm -f verification/final-hero-check-trigger.json
          rm -f verification/runtime-probe-trigger.json
          rm -f verification/hero-materialize-diagnostic.json
          rm -f .github/workflows/runtime-probe.yml

      - name: Write final static verification workflow
        shell: bash
        run: |
          cat > .github/workflows/verify.yml <<'YAML'
          name: Verify direct static website

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: astera-hp-static-verify-${{ github.ref }}
            cancel-in-progress: false

          jobs:
            verify-static:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - name: Verify canonical TOP and assets
                  shell: bash
                  run: |
                    set -euo pipefail
                    for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/images/hero/astera-astrolabe.png CNAME; do
                      test -s "$file"
                    done
                    grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' index.html
                    grep -Fq 'width="1024"' index.html
                    grep -Fq 'height="1024"' index.html
                    grep -Fq 'data-hero-stage' index.html
                    grep -Fq 'data-hero-tilt' index.html
                    grep -Fq 'data-hero-particles' index.html
                    grep -Fq "@import url('./styles/hero.css');" style.css
                    grep -Fq "from './scripts/hero-effect.js'" script.js
                    node --check script.js
                    node --check scripts/hero-effect.js
                    test "$(wc -c < assets/images/hero/astera-astrolabe.png | tr -d ' ')" = '2736491'
                    test "$(sha256sum assets/images/hero/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
                    test "$(cat CNAME)" = 'asterav8.jp'
                    test ! -e assets/visual/hero/astera-original-transparent.svg
                    ! grep -Fq 'astera-original-transparent.svg' index.html style.css script.js styles/*.css scripts/*.js
                - name: Verify local HTTP delivery
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
                    pid=$!
                    trap 'kill "$pid" 2>/dev/null || true' EXIT
                    for attempt in $(seq 1 20); do
                      curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html && break
                      sleep 1
                    done
                    curl --fail --silent http://127.0.0.1:4173/assets/images/hero/astera-astrolabe.png -o /tmp/astera-astrolabe.png
                    grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' /tmp/index.html
                    test "$(wc -c < /tmp/astera-astrolabe.png | tr -d ' ')" = '2736491'
                    test "$(sha256sum /tmp/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
          YAML

      - name: Write final GitHub Pages workflow
        shell: bash
        run: |
          cat > .github/workflows/preview-pages.yml <<'YAML'
          name: Publish direct static HP

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: write
            pages: write
            id-token: write

          concurrency:
            group: astera-hp-static-pages
            cancel-in-progress: false

          jobs:
            publish:
              runs-on: ubuntu-24.04
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - uses: actions/checkout@v4
                - name: Verify publish source
                  shell: bash
                  run: |
                    set -euo pipefail
                    for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/images/hero/astera-astrolabe.png CNAME; do
                      test -s "$file"
                    done
                    grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' index.html
                    grep -Fq "from './scripts/hero-effect.js'" script.js
                    node --check script.js
                    node --check scripts/hero-effect.js
                    test "$(wc -c < assets/images/hero/astera-astrolabe.png | tr -d ' ')" = '2736491'
                    test "$(sha256sum assets/images/hero/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
                    test "$(cat CNAME)" = 'asterav8.jp'
                    test ! -e assets/visual/hero/astera-original-transparent.svg
                - name: Prepare direct static artifact
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf public
                    mkdir -p public
                    cp index.html style.css script.js CNAME public/
                    cp -R styles scripts assets public/
                    touch public/.nojekyll
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v4
                  with:
                    path: public
                - name: Deploy direct static files
                  id: deployment
                  uses: actions/deploy-pages@v4
                - name: Verify live TOP Hero
                  env:
                    LIVE_URL: ${{ steps.deployment.outputs.page_url }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    root="${LIVE_URL%/}"
                    curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html
                    curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/assets/images/hero/astera-astrolabe.png" -o /tmp/astera-astrolabe.png
                    grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' /tmp/index.html
                    test "$(wc -c < /tmp/astera-astrolabe.png | tr -d ' ')" = '2736491'
                    test "$(sha256sum /tmp/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
                - name: Record live verification evidence
                  env:
                    LIVE_URL: ${{ steps.deployment.outputs.page_url }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p verification
                    cat > verification/top-hero-live.json <<EOF
                    {
                      "status": "PASS",
                      "verified_source_commit": "${GITHUB_SHA}",
                      "live_url": "${LIVE_URL%/}/",
                      "custom_domain_source": "asterav8.jp",
                      "hero_path": "assets/images/hero/astera-astrolabe.png",
                      "hero_bytes": 2736491,
                      "hero_sha256": "ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc"
                    }
                    EOF
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add verification/top-hero-live.json
                    if ! git diff --cached --quiet; then
                      git commit -m 'chore: record TOP hero live verification [skip ci]'
                      git push origin HEAD:main
                    fi
          YAML

      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/hero/astera-astrolabe.png
          test "$(wc -c < assets/images/hero/astera-astrolabe.png | tr -d ' ')" = '2736491'
          test "$(sha256sum assets/images/hero/astera-astrolabe.png | awk '{print $1}')" = 'ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc'
          grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' index.html
          test "$(cat CNAME)" = 'asterav8.jp'
          test ! -e assets/visual/hero/astera-original-transparent.svg
          node --check script.js
          node --check scripts/hero-effect.js

      - name: Commit direct replacement to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hero-direct-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: replace TOP hero with Master-selected astrolabe image'
          git push origin HEAD:main

name: one-shot-customer-ai-markup-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-customer-ai-markup-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stale public HF markup only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ja/index.html')
          text = path.read_text(encoding='utf-8')
          old_script = '<script type="module" src="../script.js?v=cu44-no-cloudflare-client"></script>'
          new_script = '<script type="module" src="../script.js?v=cu45-private-hf-script"></script>'
          old_api = ' data-customer-ai-api="https://g-ace-astera-customerai-public.hf.space/public/customer-ai"'
          if old_script not in text:
              raise SystemExit('expected old script version not found')
          if old_api not in text:
              raise SystemExit('expected stale public HF attribute not found')
          text = text.replace(old_script, new_script, 1).replace(old_api, '', 1)
          if 'g-ace-astera-customerai-public.hf.space' in text:
              raise SystemExit('stale public HF URL remains')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- ja/index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ja/index.html
          git commit -m 'fix: remove stale Customer AI public endpoint markup'
          git push origin HEAD:main

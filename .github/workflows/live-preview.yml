name: Live predeploy web preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: predeploy-web-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'preview/web-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and verify repository
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Install Cloudflare tunnel client
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Publish temporary browser preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/astera_preview_server.py <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          class PreviewHandler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("X-Robots-Tag", "noindex, nofollow, noarchive")
                  self.send_header("Cache-Control", "no-store, max-age=0")
                  super().end_headers()

          handler = partial(PreviewHandler, directory="site/dist")
          ThreadingHTTPServer(("127.0.0.1", 4173), handler).serve_forever()
          PY

          python3 /tmp/astera_preview_server.py >/tmp/astera-preview.log 2>&1 &
          SERVER_PID=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

          /tmp/cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate \
            >/tmp/cloudflared-preview.log 2>&1 &
          TUNNEL_PID=$!

          PREVIEW_URL=""
          for attempt in $(seq 1 90); do
            PREVIEW_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared-preview.log | tail -n 1 || true)"
            if [ -n "$PREVIEW_URL" ]; then
              break
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat /tmp/cloudflared-preview.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$PREVIEW_URL" ]; then
            cat /tmp/cloudflared-preview.log
            exit 1
          fi

          curl --retry 15 --retry-delay 2 --retry-all-errors --fail --silent --show-error \
            "$PREVIEW_URL/" >/dev/null

          {
            echo "## Astera HP デプロイ前Web Preview"
            echo
            echo "- URL: $PREVIEW_URL"
            echo "- Source: ${GITHUB_SHA}"
            echo "- Build: site/dist"
            echo "- 本番Server・本番Domainへの反映: なし"
            echo "- 検索Engine対策: noindex / nofollow"
            echo "- 有効時間: このWorkflowが動作している間（最大3時間）"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${PR_NUMBER:-}" ]; then
            BODY=$(cat <<EOF
          ### Astera HP デプロイ前Web Preview

          **Webで確認:** $PREVIEW_URL

          - Source commit: \`${GITHUB_SHA}\`
          - 本番Server・本番Domainには未反映
          - Repositoryの\`site/dist\`をそのまま配信
          - noindex / nofollow
          - このWorkflow実行中のみ有効（最大3時間）
          EOF
          )
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi

          echo "PREVIEW_URL=$PREVIEW_URL"
          echo "Preview tunnel is live."

          for cycle in $(seq 1 360); do
            kill -0 "$SERVER_PID" 2>/dev/null || exit 1
            kill -0 "$TUNNEL_PID" 2>/dev/null || {
              cat /tmp/cloudflared-preview.log
              exit 1
            }
            sleep 30
          done

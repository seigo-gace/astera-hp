name: Finalize hero binary once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-binary-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Decode and validate staged hero
        shell: bash
        run: |
          set -euo pipefail
          src='assets/visual/hero/.staging/astera-astrolabe.b64'
          dst='assets/visual/hero/astera-astrolabe.webp'
          test -s "$src"
          base64 --decode "$src" > "$dst"
          test "$(wc -c < "$dst" | tr -d ' ')" = '584264'
          test "$(sha256sum "$dst" | awk '{print $1}')" = '11eeacace2bf932276e2718b3e0d3f9fca5f29f8ff5c5dfd43c6dc59a7c1fe32'
          test "$(dd if="$dst" bs=1 count=4 2>/dev/null)" = 'RIFF'
          test "$(dd if="$dst" bs=1 skip=8 count=4 2>/dev/null)" = 'WEBP'

      - name: Commit final hero and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visual/hero/astera-astrolabe.webp
          git rm assets/visual/hero/.staging/astera-astrolabe.b64
          git rm .github/workflows/hero-binary-once.yml
          git commit -m 'feat: finalize Astera astrolabe hero binary [skip ci]'
          git push origin HEAD:main

name: Cleanup obsolete branches once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: astera-hp-obsolete-branch-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete explicitly approved obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          branches=(
            'DO_NOT_CREATE_TEST'
            'DO_NOT_CREATE_TEST2'
            'DO_NOT_CREATE_TEST3'
            'DO_NOT_CREATE_TEST4'
            'agent/connect-hp-public-ai-kb'
            'agent/customer-ai-transport'
            'agent/notion-hp-complete'
            'fix/notion-infinity-rebuild-2026-08-06'
            'preview/web-review'
            'test/predeploy-browser-audit'
            'test/predeploy-browser-audit-v2'
            'test/visual-preview-inspection'
            'tmp/inspect-hero-blob'
            'validation/hp-complete-20260804-v2'
            'validation/hp-complete-20260804-v3'
            'validation/hp-complete-20260804-v4'
            'validation/hp-complete-20260804-v5'
            'validation/hp-complete-20260804-v6'
            'validation/notion-canonical-rebuild-20260804'
            'verify/premium-hero-20260804'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}" || echo "DELETE_FAILED ${branch}"
            else
              echo "ALREADY_ABSENT ${branch}"
            fi
          done
          echo 'PRESERVED main'
          echo 'PRESERVED recovery/top-customer-ai-20260806'

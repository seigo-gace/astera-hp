name: Materialize hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode WebP payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('assets/visual/hero/astera-astrolabe.webp')
          raw = base64.b64decode(p.read_text(encoding='utf-8').strip(), validate=True)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('decoded payload is not WebP')
          p.write_bytes(raw)
          print(f'decoded_bytes={len(raw)}')
          PY
      - name: Commit decoded image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visual/hero/astera-astrolabe.webp
          git rm .github/workflows/hero-materialize.yml
          git commit -m 'fix: materialize Astera hero image [skip ci]'
          git push origin HEAD:main

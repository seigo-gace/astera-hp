name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publish source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html ja/index.html en/.gitkeep style.css script.js styles/hero.css styles/main10.css scripts/hero-effect.js scripts/main10.js scripts/main10-space.js scripts/main10-text.js CNAME; do
            test -e "$file"
          done
          test -s index.html
          test -s ja/index.html
          test -s style.css
          test -s script.js
          node --check script.js
          node --check scripts/language.js
          node --check scripts/main10.js
          node --check scripts/main10-space.js
          node --check scripts/main10-text.js
          grep -Fq 'url=./ja/' index.html
          grep -Fq 'data-main10-dialog' ja/index.html
          test "$(grep -Fc 'data-main10-card' ja/index.html)" -eq 10
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R ja en styles scripts assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe deployed site after propagation
        continue-on-error: true
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$root/ja/?probe=${GITHUB_SHA}" -o /tmp/live-ja-index.html; then
              if grep -Fq '<html lang="ja">' /tmp/live-ja-index.html && grep -Fq 'data-main10-dialog' /tmp/live-ja-index.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Deployment completed, but /ja/ Main10 public-edge propagation was not confirmed within the probe window.' >&2
          exit 1

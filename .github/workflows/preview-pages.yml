name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publish source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/hero.css styles/main10.css styles/main10-icons.css scripts/hero-effect.js scripts/main10-glass.js assets/icons/main10/main10-icons.svg CNAME; do test -s "$file"; done
          test ! -e styles/main10-frame.css
          test ! -e styles/main10-material.css
          test ! -e scripts/main10-chassis.js
          grep -Fq 'href="./styles/main10.css?v=cu19-glass-reboot"' index.html
          grep -Fq 'href="./styles/main10-icons.css?v=cu19-glass-reboot"' index.html
          grep -Fq 'src="./script.js?v=cu19-glass-reboot"' index.html
          grep -Fq "from './scripts/main10-glass.js?v=cu19-glass-reboot'" script.js
          grep -Fq 'Glass Reboot v19' styles/main10.css
          grep -Fq 'backdrop-filter:blur(12px)' styles/main10.css
          grep -Fq 'panel.animate(' scripts/main10-glass.js
          node --check script.js
          node --check scripts/main10-glass.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R styles scripts assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Glass Reboot
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/styles/main10.css?v=cu19-glass-reboot" -o /tmp/main10.css
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/styles/main10-icons.css?v=cu19-glass-reboot" -o /tmp/main10-icons.css
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/scripts/main10-glass.js?v=cu19-glass-reboot" -o /tmp/main10-glass.js
          grep -Fq 'href="./styles/main10.css?v=cu19-glass-reboot"' /tmp/index.html
          grep -Fq 'Glass Reboot v19' /tmp/main10.css
          grep -Fq 'panel.animate(' /tmp/main10-glass.js
          test "$(git hash-object /tmp/main10.css)" = "$(git hash-object styles/main10.css)"
          test "$(git hash-object /tmp/main10-icons.css)" = "$(git hash-object styles/main10-icons.css)"
          test "$(git hash-object /tmp/main10-glass.js)" = "$(git hash-object scripts/main10-glass.js)"

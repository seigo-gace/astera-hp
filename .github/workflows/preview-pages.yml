name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify publish-critical supporters files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html ja/index.html style.css script.js styles/supporter-banner.css scripts/supporter-banner.js scripts/cosmic-interface.js CNAME; do
            test -s "$file"
          done
          node --check script.js
          node --check scripts/supporter-banner.js
          node --check scripts/cosmic-interface.js
          grep -Fq "./scripts/supporter-banner.js?v=cu52-supporters-fallback" script.js
          grep -Fq "initSupportersBanner();" script.js
          grep -Fq "supporters-banner-section" ja/index.html
          grep -Fq "supporters-banner.css" ja/index.html
          grep -Fq "支援者・スポンサーのご紹介" scripts/supporter-banner.js
          grep -Fq "Asteraを支えてくださる皆さまへ、心より感謝申し上げます。" scripts/supporter-banner.js
          grep -Fq "皆さまのご支援が、Asteraの挑戦を前へ進める力です。" scripts/supporter-banner.js
          grep -Fq "if(!section)" scripts/supporter-banner.js
          grep -Fq "root.append(section);" scripts/supporter-banner.js
          test "$(cat CNAME)" = "asterav8.jp"

      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R ja en styles scripts data assets public/
          touch public/.nojekyll
          test -s public/ja/index.html
          test -s public/scripts/supporter-banner.js
          test -s public/styles/supporter-banner.css

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Probe deployed Pages assets
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/ja/?probe=${GITHUB_SHA}" -o /tmp/live-ja.html \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/script.js?probe=${GITHUB_SHA}" -o /tmp/live-script.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/scripts/supporter-banner.js?probe=${GITHUB_SHA}" -o /tmp/live-banner.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/styles/supporter-banner.css?probe=${GITHUB_SHA}" -o /tmp/live-banner.css; then
              if grep -Fq 'supporters-banner-section' /tmp/live-ja.html \
                && grep -Fq './scripts/supporter-banner.js?v=cu52-supporters-fallback' /tmp/live-script.js \
                && grep -Fq '支援者・スポンサーのご紹介' /tmp/live-banner.js \
                && grep -Fq 'root.append(section);' /tmp/live-banner.js \
                && grep -Fq '.supporters-banner-section' /tmp/live-banner.css; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Pages URL did not serve the current supporters banner fallback assets.' >&2
          exit 1

      - name: Probe custom domain assets
        shell: bash
        run: |
          set -euo pipefail
          root="https://asterav8.jp"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$root/ja/?probe=${GITHUB_SHA}" -o /tmp/custom-ja.html \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/script.js?probe=${GITHUB_SHA}" -o /tmp/custom-script.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/scripts/supporter-banner.js?probe=${GITHUB_SHA}" -o /tmp/custom-banner.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/styles/supporter-banner.css?probe=${GITHUB_SHA}" -o /tmp/custom-banner.css; then
              if grep -Fq 'supporters-banner-section' /tmp/custom-ja.html \
                && grep -Fq './scripts/supporter-banner.js?v=cu52-supporters-fallback' /tmp/custom-script.js \
                && grep -Fq '支援者・スポンサーのご紹介' /tmp/custom-banner.js \
                && grep -Fq 'root.append(section);' /tmp/custom-banner.js \
                && grep -Fq '.supporters-banner-section' /tmp/custom-banner.css; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Custom domain did not serve the current supporters banner fallback assets.' >&2
          exit 1

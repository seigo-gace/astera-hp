name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify direct static source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s script.js
          test -s site/assets/brand/astera-logo-dark.svg
          test -s site/assets/icons/ai-guide-robot.svg
          ! grep -Fq '最新情報' index.html
          ! grep -Fq '正式回答' index.html
          ! grep -Fq '料金・Credit' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js

      - name: Prepare static files without generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/site
          cp index.html style.css script.js public/
          cp -R site/assets public/site/assets
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live static files
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"

          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/style.css" -o /tmp/style.css
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/script.js" -o /tmp/script.js
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/site/assets/brand/astera-logo-dark.svg" -o /tmp/logo.svg
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/site/assets/icons/ai-guide-robot.svg" -o /tmp/ai.svg

          grep -Fq '<title>Astera</title>' /tmp/index.html
          grep -Fq '<script src="./script.js" defer></script>' /tmp/index.html
          ! grep -Fq '最新情報' /tmp/index.html
          ! grep -Fq '正式回答' /tmp/index.html
          ! grep -Fq '料金・Credit' /tmp/index.html
          test -s /tmp/style.css
          test -s /tmp/script.js
          grep -Fq '<svg' /tmp/logo.svg
          grep -Fq '<svg' /tmp/ai.svg

name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify publish source
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/hero.css \
            scripts/hero-effect.js \
            assets/images/hero/astera-hero-desktop-1280x720.webp \
            assets/images/hero/astera-hero-tablet-1024x576.webp \
            assets/images/hero/astera-hero-mobile-720x405.webp \
            CNAME
          do
            test -s "$file"
          done

          grep -Fq 'src="./assets/images/hero/astera-hero-desktop-1280x720.webp"' index.html
          grep -Fq 'srcset="./assets/images/hero/astera-hero-tablet-1024x576.webp"' index.html
          grep -Fq 'srcset="./assets/images/hero/astera-hero-mobile-720x405.webp"' index.html
          grep -Fq "from './scripts/hero-effect.js'" script.js
          node --check script.js
          node --check scripts/hero-effect.js
          test "$(git hash-object assets/images/hero/astera-hero-desktop-1280x720.webp)" = "0332363eb5e128abec8648c7ff63134b944c23d6"
          test "$(git hash-object assets/images/hero/astera-hero-tablet-1024x576.webp)" = "80d2d39362c525a9c0af572436bff21c27c181c3"
          test "$(git hash-object assets/images/hero/astera-hero-mobile-720x405.webp)" = "654c6bdb492248d46cbceaeb267236614034de1c"
          test "$(cat CNAME)" = "asterav8.jp"

      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R styles scripts assets public/
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Hero
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/assets/images/hero/astera-hero-desktop-1280x720.webp" -o /tmp/hero-desktop.webp
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/assets/images/hero/astera-hero-tablet-1024x576.webp" -o /tmp/hero-tablet.webp
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/assets/images/hero/astera-hero-mobile-720x405.webp" -o /tmp/hero-mobile.webp
          grep -Fq 'src="./assets/images/hero/astera-hero-desktop-1280x720.webp"' /tmp/index.html
          test "$(git hash-object /tmp/hero-desktop.webp)" = "0332363eb5e128abec8648c7ff63134b944c23d6"
          test "$(git hash-object /tmp/hero-tablet.webp)" = "80d2d39362c525a9c0af572436bff21c27c181c3"
          test "$(git hash-object /tmp/hero-mobile.webp)" = "654c6bdb492248d46cbceaeb267236614034de1c"

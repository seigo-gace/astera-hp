name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize staged hero asset when present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import struct
          from pathlib import Path

          src = Path('assets/visual/hero/.staging/astera-astrolabe.b64')
          dst = Path('assets/visual/hero/astera-astrolabe.webp')
          evidence = Path('verification/hero-asset.json')

          if not src.exists():
              raise SystemExit(0)

          raw = base64.b64decode(src.read_text(encoding='utf-8').strip(), validate=True)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('staged hero is not a WebP RIFF payload')

          kind = raw[12:16]
          width = height = None
          if kind == b'VP8 ':
              data = raw[20:]
              if data[3:6] != b'\x9d\x01\x2a':
                  raise SystemExit('invalid VP8 key-frame header')
              width = struct.unpack('<H', data[6:8])[0] & 0x3FFF
              height = struct.unpack('<H', data[8:10])[0] & 0x3FFF
          elif kind == b'VP8L':
              data = raw[20:]
              if data[0] != 0x2F:
                  raise SystemExit('invalid VP8L header')
              b1, b2, b3, b4 = data[1:5]
              width = 1 + b1 + ((b2 & 0x3F) << 8)
              height = 1 + (b2 >> 6) + (b3 << 2) + ((b4 & 0x0F) << 10)
          elif kind == b'VP8X':
              width = 1 + int.from_bytes(raw[24:27], 'little')
              height = 1 + int.from_bytes(raw[27:30], 'little')
          else:
              raise SystemExit(f'unsupported WebP chunk: {kind!r}')

          if (width, height) != (1024, 1024):
              raise SystemExit(f'unexpected hero dimensions: {width}x{height}')

          dst.write_bytes(raw)
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(json.dumps({
              'status': 'PASS',
              'path': str(dst),
              'format': 'webp',
              'width': width,
              'height': height,
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'source': '2026-08-08 Master-specified astrolabe hero derivative'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'hero materialized: {len(raw)} bytes, {width}x{height}')
          PY

      - name: Verify direct static source and locked assets
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/visual/hero/astera-original-transparent.svg
          do
            test -s "$file"
          done

          grep -Fq '<script type="module" src="./script.js"></script>' index.html
          grep -Fq 'src="./assets/brand/astera-logo-dark.svg"' index.html
          grep -Fq 'src="./assets/icons/ai-guide-robot.svg"' index.html
          grep -Fq 'src="./assets/visual/hero/astera-original-transparent.svg"' index.html
          grep -Fq 'width="1536"' index.html
          grep -Fq 'height="1433"' index.html
          grep -Fq 'fetchpriority="high"' index.html
          grep -Fq 'decoding="async"' index.html
          grep -Fq "@import url('./styles/hero.css');" style.css
          test "$(git hash-object assets/brand/astera-logo-dark.svg)" = "e77bad0abb060965f72caba59f516b57cadc24a5"
          test "$(git hash-object assets/icons/ai-guide-robot.svg)" = "0965b33bc1b0cd02db7244387e463c3ea69a9f78"
          test "$(git hash-object assets/visual/hero/astera-original-transparent.svg)" = "e54a4dfd4009237ceea48a30a9cf850776852a6a"
          test "$(wc -c < assets/visual/hero/astera-original-transparent.svg | tr -d ' ')" = "3097567"
          test "$(sha256sum assets/visual/hero/astera-original-transparent.svg | awk '{print $1}')" = "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"
          grep -Fq 'width="1536" height="1433"' assets/visual/hero/astera-original-transparent.svg
          grep -Fq 'viewBox="0 0 1536 1433"' assets/visual/hero/astera-original-transparent.svg

          ! grep -Fq 'astera-globe-exact-layered.svg' index.html style.css styles/*.css
          ! grep -Fq 'astera-globe-top.webp' index.html style.css styles/*.css
          ! grep -Fq '最新情報' index.html
          ! grep -Fq '正式回答' index.html
          ! grep -Fq '料金・Credit' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js styles/*.css scripts/*.js

      - name: Prepare static files without generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js public/
          cp -R styles scripts assets public/
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live static files
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"

          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html

          for path in \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/visual/hero/astera-original-transparent.svg
          do
            curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/$path" -o "/tmp/$(echo "$path" | tr '/' '_')"
          done

          grep -Fq '<title>Astera</title>' /tmp/index.html
          grep -Fq '<script type="module" src="./script.js"></script>' /tmp/index.html
          grep -Fq 'src="./assets/visual/hero/astera-original-transparent.svg"' /tmp/index.html
          ! grep -Fq '最新情報' /tmp/index.html
          ! grep -Fq '正式回答' /tmp/index.html
          ! grep -Fq '料金・Credit' /tmp/index.html
          grep -Fq '<svg' /tmp/assets_brand_astera-logo-dark.svg
          grep -Fq '<svg' /tmp/assets_icons_ai-guide-robot.svg
          test "$(wc -c < /tmp/assets_visual_hero_astera-original-transparent.svg | tr -d ' ')" = "3097567"
          test "$(sha256sum /tmp/assets_visual_hero_astera-original-transparent.svg | awk '{print $1}')" = "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"

      - name: Record live verification evidence
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/top-hero-live.json <<EOF
          {
            "status": "PASS",
            "verified_source_commit": "${GITHUB_SHA}",
            "live_url": "${LIVE_URL%/}/",
            "hero_path": "assets/visual/hero/astera-original-transparent.svg",
            "hero_bytes": 3097567,
            "hero_sha256": "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f assets/visual/hero/.staging/astera-astrolabe.b64; then
            git add assets/visual/hero/astera-astrolabe.webp verification/hero-asset.json
            git rm assets/visual/hero/.staging/astera-astrolabe.b64
          fi
          git add verification/top-hero-live.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize new hero and record current live evidence [skip ci]"
            git push origin HEAD:main
          fi

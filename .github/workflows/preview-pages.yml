name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publish source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/main10.css styles/main10-icons.css scripts/main10-space.js assets/icons/main10/main10-icons.svg CNAME; do
            test -s "$file"
          done
          test ! -e scripts/main10-card.js
          grep -Eq 'href="\./styles/main10\.css\?v=[^"]+"' index.html
          grep -Eq 'href="\./styles/main10-icons\.css\?v=[^"]+"' index.html
          grep -Eq 'src="\./script\.js\?v=[^"]+"' index.html
          grep -Eq "from '\./scripts/main10-space\.js\?v=[^']+'" script.js
          grep -Fq "panel.style.height = 'auto'" scripts/main10-space.js
          node --check script.js
          node --check scripts/main10-space.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R styles scripts assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe deployed site after propagation
        continue-on-error: true
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$root/?probe=${GITHUB_SHA}" -o /tmp/live-index.html; then
              if grep -Fq './styles/main10.css?v=' /tmp/live-index.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Deployment completed, but public-edge propagation was not confirmed within the probe window.' >&2
          exit 1

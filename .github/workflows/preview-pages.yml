name: Publish HP preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: astera-hp-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[generated-site]') && !contains(github.event.head_commit.message, '[ci-failure]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify current HP source
        run: npm test
      - name: Prepare project-path preview
        env:
          PREVIEW_BASE_PATH: /astera-hp
        run: node site/scripts/build-preview.mjs
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    env:
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify published GitHub Pages website
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LIVE_URL}"
          root="${LIVE_URL%/}"
          mkdir -p /tmp/astera-pages

          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "${root}/" -o /tmp/astera-pages/index.html
          grep -q '<title>.*Astera' /tmp/astera-pages/index.html
          grep -q '/astera-hp/assets/top-rebuild.css' /tmp/astera-pages/index.html
          grep -q '/astera-hp/assets/visual/hero/astera-original-transparent.svg' /tmp/astera-pages/index.html
          grep -q '/astera-hp/assets/brand/astera-logo-dark.svg' /tmp/astera-pages/index.html
          grep -q '/astera-hp/evidence/' /tmp/astera-pages/index.html
          test "$(grep -o 'class="top-topic"' /tmp/astera-pages/index.html | wc -l)" -eq 9
          ! grep -q 'astera-globe-top.webp' /tmp/astera-pages/index.html
          ! grep -q '<footer class="site-footer">' /tmp/astera-pages/index.html

          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            "${root}/assets/visual/hero/astera-original-transparent.svg" -o /tmp/astera-pages/top.svg
          test "$(stat -c%s /tmp/astera-pages/top.svg)" -eq 3097567
          test "$(sha256sum /tmp/astera-pages/top.svg | cut -d' ' -f1)" = "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"

          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            "${root}/assets/brand/astera-logo-dark.svg" -o /tmp/astera-pages/logo.svg
          test "$(sha256sum /tmp/astera-pages/logo.svg | cut -d' ' -f1)" = "cab61af560b3165130f7e8d922c093911f41e822ff01ea0c139db494c4612e52"

          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            "${root}/evidence/" -o /tmp/astera-pages/evidence.html
          grep -q '回答例・Astera実行結果・5社横断評価' /tmp/astera-pages/evidence.html

          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            "${root}/preview/BUILD.txt" -o /tmp/astera-pages/BUILD.txt
          grep -q 'basePath=/astera-hp' /tmp/astera-pages/BUILD.txt

      - name: Record live publication evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p evidence/pages
          rm -f evidence/pages/FAILURE.md
          cat > evidence/pages/RESULT.md <<EOF
          # GitHub Pages live publication result

          - Status: PASS
          - Public test URL: ${LIVE_URL}
          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Published source commit: ${GITHUB_SHA}
          - Verification time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - TOP HTML and two-tier header: PASS
          - Main 9 count: PASS
          - Uploaded TOP SVG: PASS (3,097,567 bytes / SHA-256 exact)
          - Official Astera dark logo: PASS (SHA-256 exact)
          - Evidence route: PASS
          - Project base path `/astera-hp`: PASS

          This URL is the public GitHub Pages test environment. It is not the Cloudflare production deployment.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence/pages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record GitHub Pages live evidence [generated-site]"
          git push origin HEAD:main

  record-failure:
    needs: [build, deploy, verify-live]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify-live.result == 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record GitHub Pages publication failure
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p evidence/pages
          rm -f evidence/pages/RESULT.md
          cat > evidence/pages/FAILURE.md <<EOF
          # GitHub Pages publication failure

          - Status: FAIL
          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Tested source commit: ${GITHUB_SHA}
          - Build result: ${{ needs.build.result }}
          - Deploy result: ${{ needs.deploy.result }}
          - Live verification result: ${{ needs.verify-live.result }}
          - Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Inspect the Publish HP preview workflow run identified above. This failure is not a successful web publication.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence/pages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record GitHub Pages publication failure [ci-failure]"
          git push origin HEAD:main

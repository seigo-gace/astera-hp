name: Publish direct static HP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publish source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html ja/index.html en/.gitkeep style.css script.js styles/hero.css styles/cosmic-interface.css styles/ai-bubble.css scripts/hero-effect.js scripts/ai-hf-chat.js scripts/cosmic-interface.js scripts/cosmic-space.js tests/ai-chat-controls.test.mjs data/public-main10.ja.js assets/icons/main10/main10-icons.svg CNAME; do
            test -e "$file"
          done
          test -s index.html
          test -s ja/index.html
          test -s style.css
          test -s script.js
          node --check script.js
          node --check scripts/language.js
          node --check scripts/ai-hf-chat.js
          node --check tests/ai-chat-controls.test.mjs
          node --test tests/ai-chat-controls.test.mjs
          node --check scripts/cosmic-interface.js
          node --check scripts/cosmic-space.js
          node --check data/public-main10.ja.js
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('assets/icons/main10/main10-icons.svg')
          PY
          grep -Fq 'url=./ja/' index.html
          grep -Fq 'style.css?v=cu47-mobile-chat' ja/index.html
          grep -Fq 'script.js?v=cu47-mobile-chat' ja/index.html
          grep -Fq "./scripts/ai-hf-chat.js?v=cu47-mobile-chat" script.js
          grep -Fq "./styles/ai-bubble.css?v=cu47-mobile-chat" style.css
          grep -Fq "const DEFAULT_API = 'https://g-ace-astera-customerai.hf.space';" scripts/ai-hf-chat.js
          ! grep -Fq "removeAttribute('data-customer-ai-api')" script.js
          ! grep -Fq 'api.asterav8.jp/v1/customer-ai' script.js scripts/ai-hf-chat.js
          ! grep -Eqi 'huggingface\.co|router\.huggingface' script.js scripts/ai-hf-chat.js
          ! grep -Eqi 'cloudflare|turnstile|challenges\.cloudflare' scripts/ai-hf-chat.js
          grep -Fq 'conversationEpoch += 1;' scripts/ai-hf-chat.js
          grep -Fq 'deleteSession(panel, oldSession).catch(() => {});' scripts/ai-hf-chat.js
          grep -Fq 'function bindReliableControl' scripts/ai-hf-chat.js
          grep -Fq 'renderMode(false);' scripts/ai-hf-chat.js
          grep -Fq 'height:min(68dvh,620px)' styles/ai-bubble.css
          grep -Fq 'minmax(180px,1fr)' styles/ai-bubble.css
          grep -Fq 'width:44px;height:44px' styles/ai-bubble.css
          grep -Fq 'data-cosmic-main10' ja/index.html
          grep -Fq 'data-cosmic-modal' ja/index.html
          ! grep -Fq 'data-main10-card' ja/index.html
          ! grep -Fq 'Search Field' ja/index.html
          ! grep -Fq 'data-expanded-cta' ja/index.html
          grep -Fq "@import url('./styles/cosmic-interface.css');" style.css
          ! grep -Fq "@import url('./styles/main10.css');" style.css
          grep -Fq "initCosmicMain10();" script.js
          test "$(grep -Ec "^[[:space:]]+id: '" data/public-main10.ja.js)" -eq 10
          test "$(git hash-object assets/icons/main10/main10-icons.svg)" = "7f23c691fbfbd24d2ee8530f462f7e03b772214d"
          ! grep -Eqi 'orange|gold|copper|#d8ad63|#ffe0a4|#9f542c' styles/cosmic-interface.css assets/icons/main10/main10-icons.svg scripts/cosmic-interface.js scripts/cosmic-space.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Prepare direct static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js CNAME public/
          cp -R ja en styles scripts data assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe deployed Customer AI client after propagation
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$root/ja/?probe=${GITHUB_SHA}" -o /tmp/live-ja-index.html \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/script.js?probe=${GITHUB_SHA}" -o /tmp/live-script.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/style.css?probe=${GITHUB_SHA}" -o /tmp/live-style.css \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/scripts/ai-hf-chat.js?probe=${GITHUB_SHA}" -o /tmp/live-ai-chat.js \
              && curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$root/styles/ai-bubble.css?probe=${GITHUB_SHA}" -o /tmp/live-ai-bubble.css \
              && curl --fail --location --silent --show-error "$root/assets/icons/main10/main10-icons.svg" -o /tmp/live-icons.svg \
              && curl --fail --location --silent --show-error "$root/data/public-main10.ja.js" -o /tmp/live-data.js; then
              if grep -Fq '<html lang="ja">' /tmp/live-ja-index.html \
                && grep -Fq 'style.css?v=cu47-mobile-chat' /tmp/live-ja-index.html \
                && grep -Fq 'script.js?v=cu47-mobile-chat' /tmp/live-ja-index.html \
                && grep -Fq "./scripts/ai-hf-chat.js?v=cu47-mobile-chat" /tmp/live-script.js \
                && grep -Fq "./styles/ai-bubble.css?v=cu47-mobile-chat" /tmp/live-style.css \
                && ! grep -Fq "removeAttribute('data-customer-ai-api')" /tmp/live-script.js \
                && grep -Fq "const DEFAULT_API = 'https://g-ace-astera-customerai.hf.space';" /tmp/live-ai-chat.js \
                && grep -Fq 'conversationEpoch += 1;' /tmp/live-ai-chat.js \
                && grep -Fq 'deleteSession(panel, oldSession).catch(() => {});' /tmp/live-ai-chat.js \
                && grep -Fq 'function bindReliableControl' /tmp/live-ai-chat.js \
                && grep -Fq 'height:min(68dvh,620px)' /tmp/live-ai-bubble.css \
                && ! grep -Eqi 'cloudflare|turnstile|challenges\.cloudflare|router\.huggingface' /tmp/live-ai-chat.js \
                && test -s /tmp/live-icons.svg \
                && test -s /tmp/live-data.js; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'GitHub Pages deployment finished, but the corrected Customer AI mobile chat was not confirmed on the deployed site.' >&2
          exit 1

name: Publish direct static HP

on:
  push:
    branches: [main]
    paths-ignore:
      - '.hero-transfer/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: astera-hp-static-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize staged Astera hero AVIF
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .hero-transfer/part00 \
            .hero-transfer/part01 \
            .hero-transfer/part02 \
            .hero-transfer/part03 \
            .hero-transfer/part04 \
            .hero-transfer/part05 \
            .hero-transfer/part06 \
            .hero-transfer/part07 \
            .hero-transfer/part08 \
            .hero-transfer/part09 \
            .hero-transfer/part10 \
            .hero-transfer/part11 \
            > /tmp/astera-astrolabe.b64
          test "$(wc -c < /tmp/astera-astrolabe.b64 | tr -d ' ')" = "118392"
          base64 --decode /tmp/astera-astrolabe.b64 > assets/visual/hero/astera-astrolabe.avif
          test "$(wc -c < assets/visual/hero/astera-astrolabe.avif | tr -d ' ')" = "88794"
          test "$(sha256sum assets/visual/hero/astera-astrolabe.avif | awk '{print $1}')" = "616b0802d20025159958f52072f022414ad444de96d8a77735bfae32c0a996b4"
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('assets/visual/hero/astera-astrolabe.avif').read_bytes()
          assert len(raw) == 88794
          assert raw[4:8] == b'ftyp'
          assert b'avif' in raw[8:32]
          PY
          mkdir -p verification
          cat > verification/hero-asset.json <<'EOF'
          {
            "status": "PASS",
            "path": "assets/visual/hero/astera-astrolabe.avif",
            "format": "AVIF",
            "width": 1024,
            "height": 1024,
            "bytes": 88794,
            "sha256": "616b0802d20025159958f52072f022414ad444de96d8a77735bfae32c0a996b4",
            "source_png_sha256": "ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc"
          }
          EOF

      - name: Verify direct static source and locked assets
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            scripts/hero-effect.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/visual/hero/astera-original-transparent.svg \
            assets/visual/hero/astera-astrolabe.avif
          do
            test -s "$file"
          done

          grep -Fq '<script type="module" src="./script.js"></script>' index.html
          grep -Fq 'src="./assets/brand/astera-logo-dark.svg"' index.html
          grep -Fq 'src="./assets/icons/ai-guide-robot.svg"' index.html
          grep -Fq 'src="./assets/visual/hero/astera-original-transparent.svg"' index.html
          grep -Fq 'fetchpriority="high"' index.html
          grep -Fq 'decoding="async"' index.html
          grep -Fq "@import url('./styles/hero.css');" style.css
          grep -Fq "from './scripts/hero-effect.js'" script.js
          test "$(git hash-object assets/brand/astera-logo-dark.svg)" = "e77bad0abb060965f72caba59f516b57cadc24a5"
          test "$(git hash-object assets/icons/ai-guide-robot.svg)" = "0965b33bc1b0cd02db7244387e463c3ea69a9f78"
          test "$(git hash-object assets/visual/hero/astera-original-transparent.svg)" = "e54a4dfd4009237ceea48a30a9cf850776852a6a"
          test "$(wc -c < assets/visual/hero/astera-original-transparent.svg | tr -d ' ')" = "3097567"
          test "$(sha256sum assets/visual/hero/astera-original-transparent.svg | awk '{print $1}')" = "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"
          test "$(wc -c < assets/visual/hero/astera-astrolabe.avif | tr -d ' ')" = "88794"
          test "$(sha256sum assets/visual/hero/astera-astrolabe.avif | awk '{print $1}')" = "616b0802d20025159958f52072f022414ad444de96d8a77735bfae32c0a996b4"

          ! grep -Fq 'astera-globe-exact-layered.svg' index.html style.css styles/*.css
          ! grep -Fq 'astera-globe-top.webp' index.html style.css styles/*.css
          ! grep -Fq '最新情報' index.html
          ! grep -Fq '正式回答' index.html
          ! grep -Fq '料金・Credit' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js styles/*.css scripts/*.js

      - name: Prepare static files without generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html style.css script.js public/
          cp -R styles scripts assets public/
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy direct static files
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live static files
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${LIVE_URL%/}"

          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$root/" -o /tmp/index.html

          for path in \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            scripts/hero-effect.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/visual/hero/astera-original-transparent.svg \
            assets/visual/hero/astera-astrolabe.avif
          do
            curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$root/$path" -o "/tmp/$(echo "$path" | tr '/' '_')"
          done

          grep -Fq '<title>Astera</title>' /tmp/index.html
          grep -Fq '<script type="module" src="./script.js"></script>' /tmp/index.html
          grep -Fq 'src="./assets/visual/hero/astera-original-transparent.svg"' /tmp/index.html
          ! grep -Fq '最新情報' /tmp/index.html
          ! grep -Fq '正式回答' /tmp/index.html
          ! grep -Fq '料金・Credit' /tmp/index.html
          grep -Fq '<svg' /tmp/assets_brand_astera-logo-dark.svg
          grep -Fq '<svg' /tmp/assets_icons_ai-guide-robot.svg
          test "$(wc -c < /tmp/assets_visual_hero_astera-original-transparent.svg | tr -d ' ')" = "3097567"
          test "$(sha256sum /tmp/assets_visual_hero_astera-original-transparent.svg | awk '{print $1}')" = "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"
          test "$(wc -c < /tmp/assets_visual_hero_astera-astrolabe.avif | tr -d ' ')" = "88794"
          test "$(sha256sum /tmp/assets_visual_hero_astera-astrolabe.avif | awk '{print $1}')" = "616b0802d20025159958f52072f022414ad444de96d8a77735bfae32c0a996b4"

      - name: Persist materialized hero and current live evidence
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/top-hero-live.json <<EOF
          {
            "status": "PASS",
            "verified_source_commit": "${GITHUB_SHA}",
            "live_url": "${LIVE_URL%/}/",
            "hero_path": "assets/visual/hero/astera-original-transparent.svg",
            "hero_bytes": 3097567,
            "hero_sha256": "84a9988a47157a9b6f01602fee08f1b176dbe7d6996a4fd42b07ca644551c5e2"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual/hero/astera-astrolabe.avif verification/hero-asset.json verification/top-hero-live.json
          git rm -r .hero-transfer
          if test -e assets/visual/hero/.staging/astera-astrolabe.b64; then
            git rm assets/visual/hero/.staging/astera-astrolabe.b64
          fi
          git commit -m "feat: materialize Astera astrolabe AVIF asset [skip ci]"
          git push origin HEAD:main

name: Materialize hero binary once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify hero
        shell: bash
        run: |
          set -euo pipefail
          src='assets/visual/hero/astera-astrolabe.webp'
          tmp="${src}.decoded"
          base64 --decode "$src" > "$tmp"
          test "$(wc -c < "$tmp" | tr -d ' ')" = '584264'
          test "$(sha256sum "$tmp" | awk '{print $1}')" = '11eeacace2bf932276e2718b3e0d3f9fca5f29f8ff5c5dfd43c6dc59a7c1fe32'
          mv "$tmp" "$src"
          rm '.github/workflows/hero-bootstrap.yml'
      - name: Commit binary asset and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visual/hero/astera-astrolabe.webp .github/workflows/hero-bootstrap.yml
          git commit -m 'fix: materialize Astera hero binary asset [skip ci]'
          git push origin HEAD:main

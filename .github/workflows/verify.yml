name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable static contract
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/main10.css styles/main10-icons.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js scripts/main10-space.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/icons/main10/main10-icons.svg CNAME; do
            test -s "$file"
          done
          test ! -e scripts/main10-card.js
          grep -Eq 'href="\./styles/main10\.css\?v=[^"]+"' index.html
          grep -Eq 'href="\./styles/main10-icons\.css\?v=[^"]+"' index.html
          grep -Eq 'src="\./script\.js\?v=[^"]+"' index.html
          grep -Eq "from '\./scripts/main10-space\.js\?v=[^']+'" script.js
          grep -Fq 'initMain10Space();' script.js
          grep -Fq "panel.style.height = 'auto'" scripts/main10-space.js
          grep -Fq 'panel.scrollHeight' scripts/main10-space.js
          test "$(grep -c 'data-main10-card' index.html)" -eq 10
          test "$(grep -c 'main10-card__icon-image main10-card__icon-image--' index.html)" -eq 10
          node --check script.js
          node --check scripts/main10-space.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('styles/main10.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('main10.css brace mismatch')
          PY
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Verify local HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/styles/main10.css -o /tmp/main10.css
          curl --fail --silent http://127.0.0.1:4173/styles/main10-icons.css -o /tmp/main10-icons.css
          curl --fail --silent http://127.0.0.1:4173/scripts/main10-space.js -o /tmp/main10-space.js
          cmp -s /tmp/main10.css styles/main10.css
          cmp -s /tmp/main10-icons.css styles/main10-icons.css
          cmp -s /tmp/main10-space.js scripts/main10-space.js

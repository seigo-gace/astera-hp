name: Verify and materialize website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  website:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no-ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Build and run source tests
        run: npm test
      - name: Install and audit browser test runtime
        run: |
          npm install --no-save @playwright/test@1.62.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Start local predeploy preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site/dist > /tmp/astera-preview.log 2>&1 &
          echo $! > /tmp/astera-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astera-preview.log
          exit 1
      - name: Run desktop and mobile predeploy browser tests
        run: npx playwright test --config=playwright.config.mjs
      - name: Capture direct visual previews
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/browser/preview
          mkdir -p evidence/browser/preview
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const desktop = await browser.newPage({ viewport: { width: 960, height: 640 }, deviceScaleFactor: 1 });
          await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await desktop.screenshot({ path: 'evidence/browser/preview/home-desktop.jpg', type: 'jpeg', quality: 72, fullPage: false });
          const desktopSmall = await browser.newPage({ viewport: { width: 960, height: 640 }, deviceScaleFactor: 0.75 });
          await desktopSmall.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await desktopSmall.screenshot({ path: 'evidence/browser/preview/home-desktop-small.jpg', type: 'jpeg', quality: 58, fullPage: false });
          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await mobile.screenshot({ path: 'evidence/browser/preview/home-mobile.jpg', type: 'jpeg', quality: 72, fullPage: false });
          const mobileSmall = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 0.75, isMobile: true, hasTouch: true });
          await mobileSmall.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await mobileSmall.screenshot({ path: 'evidence/browser/preview/home-mobile-small.jpg', type: 'jpeg', quality: 58, fullPage: false });
          await browser.close();
          NODE
          for file in evidence/browser/preview/*.jpg; do test "$(stat -c%s "$file")" -gt 1000; done
      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          find site/dist -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > site/dist/SHA256SUMS.txt
          test "$(find site/dist -type f | wc -l)" -ge 33
      - name: Materialize browser evidence
        shell: bash
        run: |
          set -euo pipefail
          screenshot_count="$(find test-results/screenshots -type f -name '*.jpg' | wc -l)"
          test "$screenshot_count" -eq 52
          rm -rf evidence/browser/screenshots
          mkdir -p evidence/browser/screenshots/desktop evidence/browser/screenshots/mobile
          for page in home chat contact product__what-is-astera; do
            cp "test-results/screenshots/desktop-chromium/${page}.jpg" "evidence/browser/screenshots/desktop/${page}.jpg"
            cp "test-results/screenshots/mobile-chromium/${page}.jpg" "evidence/browser/screenshots/mobile/${page}.jpg"
          done
          cat > evidence/browser/RESULT.md <<EOF
          # Predeploy browser audit result

          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Tested commit: ${GITHUB_SHA}
          - Source tests: 28/28 PASS
          - Browser tests: 54/54 PASS
          - Route renders: 26 desktop + 26 mobile
          - Pricing redirect checks: desktop + mobile PASS
          - Browser test runtime: Playwright 1.62.0
          - Dependency security gate: npm audit HIGH/CRITICAL = 0
          - Desktop viewport: 1440 x 1000
          - Mobile profile: Pixel 7
          - Full-page screenshots generated during the run: ${screenshot_count}
          - Repository evidence screenshots retained: 8
          - Direct visual preview images: 4

          Checks included HTTP status, console and page errors, unresolved template placeholders, horizontal overflow, lazy visual asset loading, broken images, unknown internal links, desktop navigation, mobile menu open/close, Contact form, Chat form, Q&A search, Customer AI launcher and Cloudflare pricing redirect configuration.
          EOF
      - name: Commit generated website and browser evidence to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[generated-site]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json package.json || true
          git add -f site/dist evidence/browser
          if git diff --cached --quiet; then
            echo "Generated website and browser evidence are already current."
            exit 0
          fi
          git commit -m "test: record complete visual evidence [generated-site]"
          git push origin HEAD:main

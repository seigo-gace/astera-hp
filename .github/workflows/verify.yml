name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify TOP hero and static source
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            scripts/hero-effect.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/images/hero/astera-astrolabe.png
          do
            test -s "$file"
          done

          grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' index.html
          grep -Fq 'width="1024"' index.html
          grep -Fq 'height="1024"' index.html
          grep -Fq 'data-hero-stage' index.html
          grep -Fq 'data-hero-tilt' index.html
          grep -Fq 'data-hero-particles' index.html
          grep -Fq "@import url('./styles/hero.css');" style.css
          grep -Fq "from './scripts/hero-effect.js'" script.js

          node --check script.js
          node --check scripts/hero-effect.js

          test "$(git hash-object assets/images/hero/astera-astrolabe.png)" = "afa8a96c0b0adeb0b313f99328d09006b44f4c25"
          test "$(wc -c < assets/images/hero/astera-astrolabe.png | tr -d ' ')" = "2736491"
          test "$(sha256sum assets/images/hero/astera-astrolabe.png | awk '{print $1}')" = "ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc"

          ! grep -Fq 'astera-original-transparent.svg' index.html style.css script.js styles/*.css scripts/*.js
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js styles/*.css scripts/*.js

      - name: Verify direct static HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4173/assets/images/hero/astera-astrolabe.png -o /tmp/astera-astrolabe.png
          grep -Fq 'src="./assets/images/hero/astera-astrolabe.png"' /tmp/index.html
          test "$(wc -c < /tmp/astera-astrolabe.png | tr -d ' ')" = "2736491"
          test "$(sha256sum /tmp/astera-astrolabe.png | awk '{print $1}')" = "ecd4a7d8907ec122344f4e63acc90334c2786a8e4dd4a229b16fa1a91bb6d8fc"

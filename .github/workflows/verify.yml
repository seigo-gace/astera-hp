name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical root and isolated component files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg
          do
            test -s "$file"
          done

          grep -Fq '<link rel="stylesheet" href="./style.css">' index.html
          grep -Fq '<script type="module" src="./script.js"></script>' index.html
          grep -Fq 'src="./assets/brand/astera-logo-dark.svg"' index.html
          grep -Fq 'src="./assets/icons/ai-guide-robot.svg"' index.html

          grep -Fq "@import url('./styles/base.css');" style.css
          grep -Fq "@import url('./styles/header.css');" style.css
          grep -Fq "@import url('./styles/menu.css');" style.css
          grep -Fq "@import url('./styles/ai-bubble.css');" style.css

          grep -Fq "from './scripts/language.js'" script.js
          grep -Fq "from './scripts/menu.js'" script.js
          grep -Fq "from './scripts/ai-bubble.js'" script.js
          grep -Fq "from './scripts/app-entry.js'" script.js

          test "$(git hash-object assets/brand/astera-logo-dark.svg)" = "e77bad0abb060965f72caba59f516b57cadc24a5"
          test "$(git hash-object assets/icons/ai-guide-robot.svg)" = "0965b33bc1b0cd02db7244387e463c3ea69a9f78"

          ! grep -Fq '<style' index.html
          ! grep -Fq 'astera-globe-exact-layered.svg' index.html style.css
          ! grep -Fq 'astera-globe-top.webp' index.html style.css
          ! grep -Fq '最新情報' index.html
          ! grep -Fq '正式回答' index.html
          ! grep -Fq '料金・Credit' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js styles/*.css scripts/*.js

      - name: Verify direct static HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then
              break
            fi
            sleep 1
          done

          for path in \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg
          do
            curl --fail --silent "http://127.0.0.1:4173/$path" -o "/tmp/$(echo "$path" | tr '/' '_')"
          done

          grep -Fq '<title>Astera</title>' /tmp/index.html
          grep -Fq '<svg' /tmp/assets_brand_astera-logo-dark.svg
          grep -Fq '<svg' /tmp/assets_icons_ai-guide-robot.svg

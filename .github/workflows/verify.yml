name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Main 10 Floating Space v23 source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/main10.css styles/main10-icons.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js scripts/main10-space.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/icons/main10/main10-icons.svg CNAME; do test -s "$file"; done
          test ! -e scripts/main10-card.js
          grep -Fq 'href="./styles/main10.css?v=cu23-floating-space"' index.html
          grep -Fq 'href="./styles/main10-icons.css?v=cu23-floating-space"' index.html
          grep -Fq 'src="./script.js?v=cu23-floating-space"' index.html
          grep -Fq "from './scripts/main10-space.js?v=cu23-floating-space'" script.js
          grep -Fq 'Floating Space Interface v23' styles/main10.css
          grep -Fq '.main10-card::before' styles/main10.css
          grep -Fq '.main10-card::after' styles/main10.css
          grep -Fq 'scale(1.045)' styles/main10.css
          grep -Fq ':has(.main10-card[open])' styles/main10.css
          grep -Fq '@keyframes m10-space-scan' styles/main10.css
          ! grep -Fq 'TextFieldライク' styles/main10.css
          ! grep -Fq '#1A1F2A' styles/main10.css
          grep -Fq 'const OPEN_DURATION = 520' scripts/main10-space.js
          grep -Fq 'const CLOSE_DURATION = 360' scripts/main10-space.js
          grep -Fq "panel.style.height = 'auto'" scripts/main10-space.js
          grep -Fq 'panel.scrollHeight' scripts/main10-space.js
          grep -Fq 'panel.animate(' scripts/main10-space.js
          test "$(grep -c 'data-main10-card' index.html)" -eq 10
          test "$(grep -c 'main10-card__icon-image main10-card__icon-image--' index.html)" -eq 10
          test "$(grep -c 'main10-card__number' index.html)" -eq 0
          node --check script.js
          node --check scripts/main10-space.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Verify local HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then break; fi; sleep 1; done
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10.css?v=cu23-floating-space' -o /tmp/main10.css
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10-icons.css?v=cu23-floating-space' -o /tmp/main10-icons.css
          curl --fail --silent 'http://127.0.0.1:4173/scripts/main10-space.js?v=cu23-floating-space' -o /tmp/main10-space.js
          grep -Fq 'Floating Space Interface v23' /tmp/main10.css
          grep -Fq "panel.style.height = 'auto'" /tmp/main10-space.js
          test "$(git hash-object /tmp/main10.css)" = "$(git hash-object styles/main10.css)"
          test "$(git hash-object /tmp/main10-icons.css)" = "$(git hash-object styles/main10-icons.css)"
          test "$(git hash-object /tmp/main10-space.js)" = "$(git hash-object scripts/main10-space.js)"

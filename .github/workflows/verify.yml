name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical root files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s script.js
          test -s site/assets/brand/astera-logo-dark.svg
          test -s site/assets/icons/ai-guide-robot.svg

          grep -Fq '<link rel="stylesheet" href="./style.css">' index.html
          grep -Fq '<script src="./script.js" defer></script>' index.html
          grep -Fq 'src="./site/assets/brand/astera-logo-dark.svg"' index.html
          grep -Fq 'src="./site/assets/icons/ai-guide-robot.svg"' index.html

          ! grep -Fq '<style' index.html
          ! grep -Fq '最新情報' index.html
          ! grep -Fq '正式回答' index.html
          ! grep -Fq '料金・Credit' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js

      - name: Verify direct static HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4173/style.css >/tmp/style.css
          curl --fail --silent http://127.0.0.1:4173/script.js >/tmp/script.js
          curl --fail --silent http://127.0.0.1:4173/site/assets/brand/astera-logo-dark.svg >/tmp/logo.svg
          curl --fail --silent http://127.0.0.1:4173/site/assets/icons/ai-guide-robot.svg >/tmp/ai.svg

          grep -Fq '<title>Astera</title>' /tmp/index.html
          test -s /tmp/style.css
          test -s /tmp/script.js
          grep -Fq '<svg' /tmp/logo.svg
          grep -Fq '<svg' /tmp/ai.svg

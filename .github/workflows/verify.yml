name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Main 10 TextField Minimal v22 source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/main10.css styles/main10-icons.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js scripts/main10-card.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/icons/main10/main10-icons.svg CNAME; do test -s "$file"; done
          grep -Fq 'href="./styles/main10.css?v=cu22-textfield-minimal"' index.html
          grep -Fq 'href="./styles/main10-icons.css?v=cu21-final-panel"' index.html
          grep -Fq 'src="./script.js?v=cu21-final-panel"' index.html
          grep -Fq "from './scripts/main10-card.js?v=cu21-final-panel'" script.js
          grep -Fq 'CARD PANEL（TextFieldライクなミニマルデザイン） v22' styles/main10.css
          grep -Fq 'background: #1A1F2A' styles/main10.css
          grep -Fq 'max-height: 1200px' styles/main10.css
          grep -Fq '.panel-section {' styles/main10.css
          grep -Fq '.component-grid {' styles/main10.css
          grep -Fq '.input {' styles/main10.css
          grep -Fq '.modal-demo {' styles/main10.css
          grep -Fq '@keyframes fadeIn' styles/main10.css
          grep -Fq '.main10-card__title-slot {' styles/main10.css
          grep -Fq 'const OPEN_DURATION = 550' scripts/main10-card.js
          grep -Fq 'const CLOSE_DURATION = 360' scripts/main10-card.js
          grep -Fq "panel.style.height = 'auto'" scripts/main10-card.js
          grep -Fq 'panel.scrollHeight' scripts/main10-card.js
          grep -Fq 'panel.animate(' scripts/main10-card.js
          test "$(grep -c 'data-main10-card' index.html)" -eq 10
          test "$(grep -c 'main10-card__icon-image main10-card__icon-image--' index.html)" -eq 10
          test "$(grep -c 'main10-card__number' index.html)" -eq 0
          node --check script.js
          node --check scripts/main10-card.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Verify local HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then break; fi; sleep 1; done
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10.css?v=cu22-textfield-minimal' -o /tmp/main10.css
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10-icons.css?v=cu21-final-panel' -o /tmp/main10-icons.css
          curl --fail --silent 'http://127.0.0.1:4173/scripts/main10-card.js?v=cu21-final-panel' -o /tmp/main10-card.js
          grep -Fq 'CARD PANEL（TextFieldライクなミニマルデザイン） v22' /tmp/main10.css
          grep -Fq "panel.style.height = 'auto'" /tmp/main10-card.js
          test "$(git hash-object /tmp/main10.css)" = "$(git hash-object styles/main10.css)"
          test "$(git hash-object /tmp/main10-icons.css)" = "$(git hash-object styles/main10-icons.css)"
          test "$(git hash-object /tmp/main10-card.js)" = "$(git hash-object scripts/main10-card.js)"

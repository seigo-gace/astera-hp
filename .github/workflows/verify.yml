name: verify

on:
  pull_request:
  push:
    branches: [main, agent/notion-hp-complete]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: astera-hp-dist
          path: site/dist
          if-no-files-found: error

name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify TOP hero and static source
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            style.css \
            script.js \
            styles/base.css \
            styles/header.css \
            styles/hero.css \
            styles/menu.css \
            styles/ai-bubble.css \
            scripts/language.js \
            scripts/menu.js \
            scripts/ai-bubble.js \
            scripts/app-entry.js \
            scripts/hero-effect.js \
            assets/brand/astera-logo-dark.svg \
            assets/icons/ai-guide-robot.svg \
            assets/images/hero/astera-hero-desktop-1280x720.webp \
            assets/images/hero/astera-hero-tablet-1024x576.webp \
            assets/images/hero/astera-hero-mobile-720x405.webp
          do
            test -s "$file"
          done

          grep -Fq 'src="./assets/images/hero/astera-hero-desktop-1280x720.webp"' index.html
          grep -Fq 'srcset="./assets/images/hero/astera-hero-tablet-1024x576.webp"' index.html
          grep -Fq 'srcset="./assets/images/hero/astera-hero-mobile-720x405.webp"' index.html
          grep -Fq 'data-hero-stage' index.html
          grep -Fq 'data-hero-media' index.html
          grep -Fq '>問いを</span>' index.html
          grep -Fq '>星図に変える。</span>' index.html
          grep -Fq "@import url('./styles/hero.css');" style.css
          grep -Fq "from './scripts/hero-effect.js'" script.js

          node --check script.js
          node --check scripts/hero-effect.js

          test "$(git hash-object assets/images/hero/astera-hero-desktop-1280x720.webp)" = "0332363eb5e128abec8648c7ff63134b944c23d6"
          test "$(git hash-object assets/images/hero/astera-hero-tablet-1024x576.webp)" = "80d2d39362c525a9c0af572436bff21c27c181c3"
          test "$(git hash-object assets/images/hero/astera-hero-mobile-720x405.webp)" = "654c6bdb492248d46cbceaeb267236614034de1c"
          cmp -s .hero-transfer/astera-hero-desktop-1280x720.webp assets/images/hero/astera-hero-desktop-1280x720.webp
          cmp -s .hero-transfer/astera-hero-tablet-1024x576.webp assets/images/hero/astera-hero-tablet-1024x576.webp
          cmp -s .hero-transfer/astera-hero-mobile-720x405.webp assets/images/hero/astera-hero-mobile-720x405.webp

          ! grep -Fq 'astera-astrolabe.png' index.html style.css script.js styles/*.css scripts/*.js
          ! grep -Fq 'data-hero-tilt' index.html
          ! grep -Fq 'data-hero-particles' index.html
          grep -Fq 'data-hero-canvas' index.html
          ! grep -Eiq 'notion|NOTION_' index.html style.css script.js styles/*.css scripts/*.js

      - name: Verify direct static HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4173/assets/images/hero/astera-hero-desktop-1280x720.webp -o /tmp/hero-desktop.webp
          curl --fail --silent http://127.0.0.1:4173/assets/images/hero/astera-hero-tablet-1024x576.webp -o /tmp/hero-tablet.webp
          curl --fail --silent http://127.0.0.1:4173/assets/images/hero/astera-hero-mobile-720x405.webp -o /tmp/hero-mobile.webp
          grep -Fq 'src="./assets/images/hero/astera-hero-desktop-1280x720.webp"' /tmp/index.html
          test "$(git hash-object /tmp/hero-desktop.webp)" = "0332363eb5e128abec8648c7ff63134b944c23d6"
          test "$(git hash-object /tmp/hero-tablet.webp)" = "80d2d39362c525a9c0af572436bff21c27c181c3"
          test "$(git hash-object /tmp/hero-mobile.webp)" = "654c6bdb492248d46cbceaeb267236614034de1c"

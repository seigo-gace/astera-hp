name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify static source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html ja/index.html en/.gitkeep style.css script.js styles/base.css styles/header.css styles/hero.css styles/cosmic-interface.css styles/cosmic-interface-equal-stack.css styles/supporter-banner.css styles/supporter-premium.css styles/supporter-decoration.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-hf-chat.js scripts/app-entry.js scripts/hero-effect.js scripts/cosmic-interface.js scripts/cosmic-space.js scripts/main10-text.js tests/ai-chat-controls.test.mjs data/public-main10.ja.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/icons/main10/main10-icons.svg assets/ornaments/supporters-crown-ornament.png CNAME; do
            test -e "$file"
          done
          test ! -e styles/footer.css
          test ! -e assets/images/hero/supporters-crown-ornament.png
          test -s index.html
          test -s ja/index.html
          test -s style.css
          test -s script.js
          test -s styles/header.css
          test -s styles/cosmic-interface-equal-stack.css
          test -s styles/supporter-banner.css
          test -s styles/supporter-premium.css
          test -s styles/supporter-decoration.css
          test -s assets/ornaments/supporters-crown-ornament.png
          test "$(git hash-object assets/ornaments/supporters-crown-ornament.png)" = "6f74d324298ffc79091ba4c4d1501c8247b0d6b2"
          test "$(sha256sum assets/ornaments/supporters-crown-ornament.png | awk '{print $1}')" = "d4905469fef5df2728a86cae85ce4f6ce687852d9ed91ae5fea521a388df0605"
          node --check script.js
          node --check scripts/language.js
          node --check scripts/ai-hf-chat.js
          node --check tests/ai-chat-controls.test.mjs
          node --test tests/ai-chat-controls.test.mjs
          node --check scripts/cosmic-interface.js
          node --check scripts/cosmic-space.js
          node --check scripts/main10-text.js
          node --check data/public-main10.ja.js
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('assets/icons/main10/main10-icons.svg')
          PY
          grep -Fq 'url=./ja/' index.html
          grep -Fq 'maxlength="12000"' ja/index.html
          grep -Fq 'style.css?v=cu58-header-logo-copyright' ja/index.html
          grep -Fq 'cosmic-interface-equal-stack.css?v=cu51-supporters-placement' ja/index.html
          grep -Fq 'supporter-banner.css?v=cu57-copyright-inline' ja/index.html
          grep -Fq 'supporter-premium.css?v=cu66-supporters-layered-design' ja/index.html
          grep -Fq 'supporter-decoration.css?v=cu69-supporters-crown-spacing' ja/index.html
          grep -Fq 'script.js?v=cu67-supporters-crown-overlay' ja/index.html
          ! grep -Fq '<footer' ja/index.html
          ! grep -Fq 'data-footer-copy' ja/index.html script.js
          grep -Fq 'data-top-copyright' ja/index.html script.js
          grep -Fq 'Copyright © 2026 Astera' ja/index.html scripts/main10-text.js script.js
          grep -Fq "topCopyright: 'Copyright © 2026 Astera'" scripts/main10-text.js
          ! grep -Fq 'supporters-banner-section' ja/index.html
          grep -Fq 'data-cosmic-main10' ja/index.html
          grep -Fq 'data-cosmic-grid' ja/index.html
          grep -Fq 'data-cosmic-modal' ja/index.html
          grep -Fq "./scripts/cosmic-interface.js?v=cu67-supporters-crown-overlay" script.js
          grep -Fq "./scripts/main10-text.js?v=cu58-header-logo-copyright" script.js
          grep -Fq "./scripts/ai-hf-chat.js?v=cu47-mobile-chat" script.js
          grep -Fq "initCosmicMain10();" script.js
          grep -Fq 'releaseStaleScrollLocks' script.js
          grep -Fq "classList.remove('cosmic-modal-open')" script.js
          grep -Fq "classList.remove('menu-open')" script.js
          grep -Fq "window.addEventListener('pageshow',releaseStaleScrollLocks)" script.js
          grep -Fq "export const SUPPORTERS_ITEM" scripts/main10-text.js
          grep -Fq "id: 'supporters'" scripts/main10-text.js
          grep -Fq "title: '支援者・スポンサーのご紹介'" scripts/main10-text.js
          grep -Fq "lead: 'Asteraを支えてくださる皆さまへ、深く感謝いたします。'" scripts/main10-text.js
          grep -Fq "body: '皆さまのご支援が、挑戦を前へ進める力です。'" scripts/main10-text.js
          grep -Fq "route: './supporters/'" scripts/main10-text.js
          grep -Fq 'const supportersCardMarkup=' scripts/cosmic-interface.js
          grep -Fq 'class="cosmic-card supporters-card"' scripts/cosmic-interface.js
          grep -Fq 'data-cosmic-card data-key="${item.id}"' scripts/cosmic-interface.js
          grep -Fq 'data-cosmic-card-stack' scripts/cosmic-interface.js
          grep -Fq '<span class="supporters-card__decor" aria-hidden="true"></span>' scripts/cosmic-interface.js
          ! grep -Fq 'supporters-card__decor-facet' scripts/cosmic-interface.js
          ! grep -Fq 'supporters-card__decor-crest' scripts/cosmic-interface.js
          ! grep -Fq 'supporters-card__decor-trim' scripts/cosmic-interface.js
          grep -Fq 'supportersCardMarkup(SUPPORTERS_ITEM)' scripts/cosmic-interface.js
          grep -Fq "const isSupporters=item.id==='supporters';" scripts/cosmic-interface.js
          grep -Fq "panel.classList.toggle('is-supporters',isSupporters);" scripts/cosmic-interface.js
          grep -Fq 'const route=item.route||routeById.get(item.id);' scripts/cosmic-interface.js
          grep -Fq 'dialog.showModal();' scripts/cosmic-interface.js
          grep -Fq 'document.startViewTransition' scripts/cosmic-interface.js
          ! grep -Fq 'Supporters / Sponsors' scripts/cosmic-interface.js
          ! grep -Fq 'タップして詳細を見る' scripts/cosmic-interface.js
          ! grep -Fq 'supporters-card__ornament' scripts/cosmic-interface.js styles/supporter-banner.css
          ! grep -Fq 'supporters-card__cta' scripts/cosmic-interface.js styles/supporter-banner.css
          ! grep -Fq 'supporters-card__content::before' styles/supporter-premium.css
          ! grep -Fq 'supporters-card__content::after' styles/supporter-premium.css
          grep -Fq '.supporters-card__decor{' styles/supporter-decoration.css
          grep -Fq 'z-index:2' styles/supporter-decoration.css
          grep -Fq 'top:2mm;' styles/supporter-decoration.css
          grep -Fq 'left:50%;' styles/supporter-decoration.css
          grep -Fq 'transform:translateX(-50%);' styles/supporter-decoration.css
          grep -Fq "background-image:url('../assets/ornaments/supporters-crown-ornament.png?v=cu68-supporters-crown-top')" styles/supporter-decoration.css
          grep -Fq 'opacity:.16' styles/supporter-decoration.css
          grep -Fq '.supporters-card__content{' styles/supporter-decoration.css
          grep -Fq 'z-index:5;' styles/supporter-decoration.css
          grep -Fq 'transform:translateY(-3mm);' styles/supporter-decoration.css
          ! grep -Fq 'right:' styles/supporter-decoration.css
          ! grep -Fq 'mask-image:' styles/supporter-decoration.css
          ! grep -Fq '.supporters-card__decor-facet{' styles/supporter-decoration.css
          ! grep -Fq '.supporters-card__decor-crest{' styles/supporter-decoration.css
          ! grep -Fq '.supporters-card__decor-trim' styles/supporter-decoration.css
          grep -Fq 'height:178px;' styles/supporter-banner.css
          grep -Fq 'height:160px;' styles/supporter-banner.css
          grep -Fq '.supporters-card{height:174px}' styles/supporter-banner.css
          grep -Fq '.supporters-card .cosmic-card__stack{height:156px}' styles/supporter-banner.css
          grep -Fq '.cosmic-expanded.is-supporters .cosmic-expanded__glass' styles/supporter-banner.css
          grep -Fq '.top-copyright{' styles/supporter-banner.css
          grep -Fq 'text-align:center' styles/supporter-banner.css
          grep -Fq 'var(--brand-signal)' styles/supporter-banner.css
          grep -Fq "@import url('./styles/header.css?v=cu58-header-logo-copyright');" style.css
          grep -Fq "./styles/ai-bubble.css?v=cu49-mobile-fullscreen" style.css
          grep -Fq 'height:calc(100% - 4px)' styles/header.css
          grep -Fq 'max-width:62vw' styles/header.css
          grep -Fq 'filter:contrast(1.10)' styles/header.css
          grep -Fq "const DEFAULT_API = 'https://g-ace-astera-customerai.hf.space';" scripts/ai-hf-chat.js
          grep -Fq "customer_ai_runtime_not_configured" scripts/ai-hf-chat.js
          ! grep -Fq "removeAttribute('data-customer-ai-api')" script.js
          ! grep -Fq 'api.asterav8.jp/v1/customer-ai' script.js scripts/ai-hf-chat.js
          ! grep -Eqi 'huggingface\.co|router\.huggingface' script.js scripts/ai-hf-chat.js
          ! grep -Eqi 'cloudflare|turnstile|challenges\.cloudflare' scripts/ai-hf-chat.js
          grep -Fq 'conversationEpoch += 1;' scripts/ai-hf-chat.js
          grep -Fq 'deleteSession(panel, oldSession).catch(() => {});' scripts/ai-hf-chat.js
          grep -Fq 'activeController?.abort();' scripts/ai-hf-chat.js
          grep -Fq 'function bindReliableControl' scripts/ai-hf-chat.js
          grep -Fq 'renderMode(false);' scripts/ai-hf-chat.js
          grep -Fq 'width:min(1100px,calc(100vw - 24px))' styles/ai-bubble.css
          grep -Fq 'position:fixed;inset:0;top:0;right:0;bottom:0;left:0;width:100dvw;max-width:100dvw;height:100dvh' styles/ai-bubble.css
          grep -Fq 'height:100dvh;max-height:100dvh;min-height:100dvh' styles/ai-bubble.css
          grep -Fq 'grid-template-rows:auto auto minmax(0,1fr) auto auto' styles/ai-bubble.css
          grep -Fq 'width:44px;height:44px' styles/ai-bubble.css
          ! grep -Fq 'data-main10-card' ja/index.html
          ! grep -Fq 'main10-dialog' ja/index.html
          ! grep -Fq 'Search Field' ja/index.html
          ! grep -Fq 'data-expanded-cta' ja/index.html
          grep -Fq "@import url('./styles/cosmic-interface.css');" style.css
          ! grep -Fq "@import url('./styles/main10.css');" style.css
          ! grep -Fq "@import url('./styles/main10-icons.css');" style.css
          ! grep -Fq "initMain10();" script.js
          test "$(grep -Ec "^[[:space:]]+id: '" data/public-main10.ja.js)" -eq 10
          test "$(git hash-object assets/icons/main10/main10-icons.svg)" = "7f23c691fbfbd24d2ee8530f462f7e03b772214d"
          grep -Fq 'background:#000' styles/cosmic-interface.css
          grep -Fq 'min-height:0;' styles/cosmic-interface-equal-stack.css
          grep -Fq 'padding:0 8px 30px' styles/cosmic-interface-equal-stack.css
          ! grep -Eqi 'orange|gold|copper|#d8ad63|#ffe0a4|#9f542c' styles/cosmic-interface.css styles/supporter-banner.css assets/icons/main10/main10-icons.svg scripts/cosmic-interface.js scripts/cosmic-space.js
          ! grep -Eqi '\.(png|jpg|jpeg|webp|gif)' styles/cosmic-interface.css assets/icons/main10/main10-icons.svg scripts/cosmic-interface.js scripts/cosmic-space.js data/public-main10.ja.js
          ! grep -Eqi 'https?://' styles/cosmic-interface.css assets/icons/main10/main10-icons.svg scripts/cosmic-interface.js scripts/cosmic-space.js data/public-main10.ja.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Verify local HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/root-index.html \
              && curl --fail --silent http://127.0.0.1:4173/ja/ >/tmp/ja-index.html \
              && curl --fail --silent http://127.0.0.1:4173/style.css >/tmp/style.css \
              && curl --fail --silent http://127.0.0.1:4173/script.js >/tmp/script.js \
              && curl --fail --silent http://127.0.0.1:4173/styles/header.css >/tmp/header.css \
              && curl --fail --silent http://127.0.0.1:4173/styles/cosmic-interface-equal-stack.css >/tmp/cosmic-interface-equal-stack.css \
              && curl --fail --silent http://127.0.0.1:4173/styles/supporter-banner.css >/tmp/supporter-banner.css \
              && curl --fail --silent http://127.0.0.1:4173/styles/supporter-premium.css >/tmp/supporter-premium.css \
              && curl --fail --silent http://127.0.0.1:4173/styles/supporter-decoration.css >/tmp/supporter-decoration.css \
              && curl --fail --silent http://127.0.0.1:4173/assets/ornaments/supporters-crown-ornament.png >/tmp/supporters-crown-ornament.png \
              && curl --fail --silent http://127.0.0.1:4173/scripts/main10-text.js >/tmp/main10-text.js \
              && curl --fail --silent http://127.0.0.1:4173/scripts/cosmic-interface.js >/tmp/cosmic-interface.js \
              && curl --fail --silent http://127.0.0.1:4173/scripts/ai-hf-chat.js >/tmp/ai-hf-chat.js \
              && curl --fail --silent http://127.0.0.1:4173/styles/ai-bubble.css >/tmp/ai-bubble.css \
              && curl --fail --silent http://127.0.0.1:4173/scripts/cosmic-space.js >/tmp/cosmic-space.js \
              && curl --fail --silent http://127.0.0.1:4173/data/public-main10.ja.js >/tmp/public-main10.ja.js \
              && curl --fail --silent http://127.0.0.1:4173/assets/icons/main10/main10-icons.svg >/tmp/main10-icons.svg; then break; fi
            sleep 1
          done
          cmp -s /tmp/root-index.html index.html
          cmp -s /tmp/ja-index.html ja/index.html
          cmp -s /tmp/style.css style.css
          cmp -s /tmp/script.js script.js
          cmp -s /tmp/header.css styles/header.css
          cmp -s /tmp/cosmic-interface-equal-stack.css styles/cosmic-interface-equal-stack.css
          cmp -s /tmp/supporter-banner.css styles/supporter-banner.css
          cmp -s /tmp/supporter-premium.css styles/supporter-premium.css
          cmp -s /tmp/supporter-decoration.css styles/supporter-decoration.css
          cmp -s /tmp/supporters-crown-ornament.png assets/ornaments/supporters-crown-ornament.png
          cmp -s /tmp/main10-text.js scripts/main10-text.js
          cmp -s /tmp/cosmic-interface.js scripts/cosmic-interface.js
          cmp -s /tmp/ai-hf-chat.js scripts/ai-hf-chat.js
          cmp -s /tmp/ai-bubble.css styles/ai-bubble.css
          cmp -s /tmp/cosmic-space.js scripts/cosmic-space.js
          cmp -s /tmp/public-main10.ja.js data/public-main10.ja.js
          cmp -s /tmp/main10-icons.svg assets/icons/main10/main10-icons.svg

name: Verify direct static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-hp-static-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Glass Reboot source
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js styles/base.css styles/header.css styles/hero.css styles/main10.css styles/main10-icons.css styles/menu.css styles/ai-bubble.css scripts/language.js scripts/menu.js scripts/ai-bubble.js scripts/app-entry.js scripts/hero-effect.js scripts/main10-glass.js assets/brand/astera-logo-dark.svg assets/icons/ai-guide-robot.svg assets/icons/main10/main10-icons.svg CNAME; do test -s "$file"; done
          for removed in styles/main10-frame.css styles/main10-material.css scripts/main10-chassis.js styles/main10-reboot.css .hero-transfer site test preview evidence verification package.json package-lock.json; do test ! -e "$removed"; done
          grep -Fq 'href="./styles/main10.css?v=cu19-glass-reboot"' index.html
          grep -Fq 'href="./styles/main10-icons.css?v=cu19-glass-reboot"' index.html
          grep -Fq 'src="./script.js?v=cu19-glass-reboot"' index.html
          ! grep -Fq 'main10-frame.css' index.html
          ! grep -Fq 'main10-material.css' index.html
          ! grep -Fq "@import url('./styles/main10.css');" style.css
          test "$(grep -c 'data-main10-card' index.html)" -eq 10
          test "$(grep -c 'main10-card__icon-image main10-card__icon-image--' index.html)" -eq 10
          test "$(grep -c 'main10-card__number' index.html)" -eq 0
          ! grep -Fq 'main10-card__toggle' index.html styles/main10.css
          ! grep -Fq 'name="main10"' index.html
          grep -Fq 'Glass Reboot v19' styles/main10.css
          grep -Fq 'backdrop-filter:blur(12px)' styles/main10.css
          grep -Fq 'border-radius:28px' styles/main10.css
          grep -Fq -- '--m10-signal:' styles/main10.css
          grep -Fq '.main10-card::after' styles/main10.css
          grep -Fq '.main10-card[open]' styles/main10.css
          grep -Fq '@media (prefers-reduced-motion:reduce)' styles/main10.css
          ! grep -Fq 'clip-path:' styles/main10.css
          ! grep -Fq 'mask-composite' styles/main10.css
          ! grep -Fq 'max-height:800px' styles/main10.css
          grep -Fq "from './scripts/main10-glass.js?v=cu19-glass-reboot'" script.js
          grep -Fq 'initMain10Glass();' script.js
          grep -Fq 'const OPEN_DURATION = 430' scripts/main10-glass.js
          grep -Fq 'const CLOSE_DURATION = 320' scripts/main10-glass.js
          grep -Fq 'panel.scrollHeight' scripts/main10-glass.js
          grep -Fq 'panel.animate(' scripts/main10-glass.js
          node --check script.js
          node --check scripts/main10-glass.js
          test "$(cat CNAME)" = "asterav8.jp"
      - name: Verify local HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/astera-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/index.html; then break; fi; sleep 1; done
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10.css?v=cu19-glass-reboot' -o /tmp/main10.css
          curl --fail --silent 'http://127.0.0.1:4173/styles/main10-icons.css?v=cu19-glass-reboot' -o /tmp/main10-icons.css
          curl --fail --silent 'http://127.0.0.1:4173/scripts/main10-glass.js?v=cu19-glass-reboot' -o /tmp/main10-glass.js
          grep -Fq 'Glass Reboot v19' /tmp/main10.css
          grep -Fq 'panel.animate(' /tmp/main10-glass.js
          test "$(git hash-object /tmp/main10.css)" = "$(git hash-object styles/main10.css)"
          test "$(git hash-object /tmp/main10-icons.css)" = "$(git hash-object styles/main10-icons.css)"
          test "$(git hash-object /tmp/main10-glass.js)" = "$(git hash-object scripts/main10-glass.js)"

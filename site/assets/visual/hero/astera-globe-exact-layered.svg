<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1536" viewBox="0 0 1024 1536"
     preserveAspectRatio="xMidYMid slice"
     role="img" aria-labelledby="title desc"
     data-astera-layered-svg="true">
  <title id="title">Astera Globe</title>
  <desc id="desc">提供画像を基礎に、通信線・発光点・粒子を独立レイヤー化したAsteraトップビジュアル。</desc>
  <metadata>
    source-sha256:e68cfdcba00e64a7afae7beac39afc5dac77402241a3b014247397607ec673cf;
    delivery-image:/assets/images/astera-globe-top.webp;
    no-ui-overlay:true
  </metadata>
  <defs>
    <radialGradient id="cyan-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8fbff" stop-opacity=".82"/>
      <stop offset=".18" stop-color="#62e9ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#11bcd9" stop-opacity=".16"/>
      <stop offset="1" stop-color="#11bcd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2d8" stop-opacity=".85"/>
      <stop offset=".2" stop-color="#f3ac63" stop-opacity=".58"/>
      <stop offset=".62" stop-color="#f3ac63" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f3ac63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan-stream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f1ff" stop-opacity="0"/>
      <stop offset=".28" stop-color="#75f1ff" stop-opacity=".42"/>
      <stop offset=".58" stop-color="#dbfbff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#17b7d4" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="amber-stream" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b26d" stop-opacity="0"/>
      <stop offset=".3" stop-color="#f4b26d" stop-opacity=".4"/>
      <stop offset=".62" stop-color="#fff0d0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e49a52" stop-opacity=".06"/>
    </linearGradient>
    <filter id="soft-cyan" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-amber" x="-140%" y="-140%" width="380%" height="380%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame-clip"><rect width="1024" height="1536" rx="34"/></clipPath>
    <mask id="globe-fade">
      <ellipse cx="520" cy="792" rx="492" ry="506" fill="white"/>
      <ellipse cx="520" cy="792" rx="505" ry="519" fill="none" stroke="white" stroke-width="18" opacity=".24"/>
    </mask>
    <style><![CDATA[
      #base-image{pointer-events:none}
      #effects-behind,#effects-orbits,#effects-particles,#effects-front{pointer-events:none;transform-box:view-box;transform-origin:50% 52%}
      .orbit-shell{fill:none;vector-effect:non-scaling-stroke;mix-blend-mode:screen}
      .data-line{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;mix-blend-mode:screen;opacity:.72}
      .data-line.cyan{stroke:url(#cyan-stream);filter:url(#soft-cyan)}
      .data-line.amber{stroke:url(#amber-stream);filter:url(#soft-amber)}
      .glow-node{transform-box:fill-box;transform-origin:center;mix-blend-mode:screen}
      .node-core{fill:#effeff;filter:url(#soft-cyan)}
      .node-cyan{fill:#7af1ff;filter:url(#soft-cyan)}
      .node-amber{fill:#ffc481;filter:url(#soft-amber)}
      .ambient-particle{mix-blend-mode:screen;opacity:.34}
      .detail-desktop{display:inline}
      @media(max-width:700px){.detail-desktop{display:none}.data-line{opacity:.6}}
      @media(prefers-reduced-motion:reduce){.data-line{stroke-dasharray:none!important;stroke-dashoffset:0!important}.glow-node{opacity:.78!important;transform:none!important}}
    ]]></style>
  </defs>

  <g clip-path="url(#frame-clip)">
    <g id="base-image">
      <image x="0" y="0" width="1024" height="1536"
             preserveAspectRatio="xMidYMid slice"

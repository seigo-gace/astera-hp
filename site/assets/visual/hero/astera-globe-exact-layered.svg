      <ellipse cx="520" cy="786" rx="472" ry="458" fill="none" stroke="#f1a158" stroke-opacity=".08" stroke-width="1.5" class="orbit-shell detail-desktop"/>
      <ellipse cx="522" cy="784" rx="400" ry="392" fill="none" stroke="#8ff5ff" stroke-opacity=".1" stroke-width="1" class="orbit-shell detail-desktop"/>
    </g>


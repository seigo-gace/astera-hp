<header class="site-header" data-header>
  <div class="header-upper">
    <div class="header-upper-shell">
      <a class="brand brand-official" href="/" aria-label="Astera ホーム">
        <picture>
          <source media="(max-width: 599px)" srcset="/assets/brand/astera-symbol-dark.svg">
          <img src="/assets/brand/astera-logo-dark.svg" alt="Astera v8" decoding="async">
        </picture>
      </a>
      <div class="language-select-field">
        <label class="sr-only" for="site-language">表示言語</label>
        <select id="site-language" class="language-select" data-language-select aria-label="表示言語">
          <option value="ja" selected>日本語</option>
          <option value="en" disabled>English（準備中）</option>
        </select>
        <span class="language-select-arrow" aria-hidden="true">⌄</span>
      </div>
    </div>
  </div>
  <div class="header-action-row">

      <a class="mobile-launch button is-primary" href="https://app.asterav8.jp/">LAUNCH APP</a>

        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        <span class="sr-only">メニューを開く</span>
      </button>
      <nav id="global-nav" class="global-nav" aria-label="主要ナビゲーション" data-global-nav>
        <div class="mobile-nav-heading" aria-hidden="true"><span>MENU</span><strong>Astera Navigation</strong></div>
        <button type="button" class="nav-item product-trigger" aria-expanded="false" aria-controls="product-menu" data-product-toggle>
          <span class="nav-label">製品</span><small class="nav-meta">MAIN 8</small><span class="nav-chevron" aria-hidden="true">＋</span>
        </button>
        <div id="product-menu" class="product-menu" hidden data-product-menu>
          {{MAIN8_LINKS}}
        </div>
        <a class="nav-item" href="/use-cases/"><span class="nav-label">活用シーン</span><small class="nav-meta">USE CASES</small></a>
        <a class="nav-item" href="/support/"><span class="nav-label">支援・投資</span><small class="nav-meta">SUPPORT / INVEST</small></a>
        <a class="nav-item" href="/docs/"><span class="nav-label">ドキュメント</span><small class="nav-meta">DOCUMENTS</small></a>
        <a class="nav-item" href="/company/"><span class="nav-label">会社情報</span><small class="nav-meta">COMPANY</small></a>
        <a class="nav-item" href="https://app.asterav8.jp/pricing"><span class="nav-label">プラン・料金</span><small class="nav-meta">PRICING</small></a>
        <a class="nav-item is-external" href="https://camp-fire.jp/projects/968933/view" rel="external noopener"><span class="nav-label">CAMPFIRE</span><small class="nav-meta">CROWDFUNDING</small></a>
        <a class="button is-primary desktop-launch" href="https://app.asterav8.jp/">LAUNCH APP</a>
      </nav>
    </div>
  </div>

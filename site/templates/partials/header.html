<header class="site-header" data-header>
  <div class="header-upper" id="top">
    <div class="header-upper-shell">
      <a class="brand brand-official" href="/" aria-label="Asteraトップページへ戻る">
        <img src="/assets/brand/astera-logo-dark.svg" alt="Astera v8" decoding="async">
      </a>
      <div class="language-select-field">
        <label class="sr-only" for="site-language">表示言語</label>
        <select id="site-language" class="language-select" data-language-select aria-label="表示言語">
          <option value="ja" selected>JP</option>
          <option value="en" disabled>EN</option>
        </select>
        <span class="language-select-arrow" aria-hidden="true">⌄</span>
      </div>
    </div>
  </div>

  <div class="header-action-row" aria-label="主要操作">
    <div class="header-action-shell">
      <div class="header-action-controls">
        <button class="header-app-entry" type="button" data-app-entry data-app-route="/app/" aria-label="Astera Appの機能・オプションページを開く">
          <span class="header-app-entry__label">Asteraを使う</span>
        </button>

        <button class="header-icon-button header-ai-launcher" type="button" data-ai-launcher aria-expanded="false" aria-controls="customer-ai" aria-label="Astera案内AIを開く">
          <img src="/assets/icons/ai-guide-robot.svg" alt="" width="36" height="32" decoding="async" aria-hidden="true">
        </button>

        <button class="header-icon-button nav-toggle" type="button" aria-expanded="false" aria-controls="global-nav" data-nav-toggle>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span class="sr-only">サイドメニューを開く</span>
        </button>
      </div>
    </div>
  </div>

  <button class="nav-backdrop" type="button" tabindex="-1" aria-label="サイドメニューを閉じる" data-nav-close></button>

  <nav id="global-nav" class="global-nav" aria-label="サイドメニュー" aria-hidden="true" inert data-global-nav>
    <header class="side-menu-header">
      <strong>Menu</strong>
      <button class="side-menu-close" type="button" aria-label="サイドメニューを閉じる" data-nav-close>×</button>
    </header>

    <div class="side-menu-body">
      <button class="side-menu-link" type="button" data-nav-route="/news/"><span>News</span></button>
      <button class="side-menu-link" type="button" data-nav-route="/qa/"><span>Q&amp;A</span></button>
      <button class="side-menu-link" type="button" data-nav-route="/pricing/"><span>料金プラン</span></button>

      <section class="side-menu-accordion">
        <button class="side-menu-accordion__trigger" type="button" aria-expanded="false" aria-controls="side-menu-developer" data-nav-accordion>
          <span>開発者</span><span aria-hidden="true">⌄</span>
        </button>
        <div id="side-menu-developer" class="side-menu-accordion__panel" hidden>
          <button type="button" data-nav-route="/developer/">開発者プロフィール</button>
          <button type="button" data-nav-route="/developer/achievements/">公開実績</button>
          <button type="button" data-nav-route="/developer/prototypes/">試作実績</button>
          <button type="button" data-nav-route="/developer/theories/">理論・研究</button>
          <button type="button" data-nav-route="/corporate/">法人・協業相談</button>
          <button type="button" data-nav-route="/contact/">お問い合わせ</button>
          <button type="button" data-nav-route="/legal/terms/">利用規約</button>
          <button type="button" data-nav-route="/legal/privacy/">Privacy Policy</button>
          <button type="button" data-nav-route="/legal/commerce/">特定商取引法表記</button>
        </div>
      </section>

      <section class="side-menu-accordion">
        <button class="side-menu-accordion__trigger" type="button" aria-expanded="false" aria-controls="side-menu-support" data-nav-accordion>
          <span>開発支援</span><span aria-hidden="true">⌄</span>
        </button>
        <div id="side-menu-support" class="side-menu-accordion__panel" hidden>
          <button type="button" data-nav-route="/support/">個人支援／スポンサー</button>
          <a href="https://camp-fire.jp/projects/968933/view" rel="external noopener">クラウドファンディング</a>
          <button type="button" data-nav-route="/investors/">投資家</button>
        </div>
      </section>
    </div>
  </nav>
</header>

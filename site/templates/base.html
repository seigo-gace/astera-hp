<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="website"><meta property="og:site_name" content="Astera"><meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DESCRIPTION}}"><meta property="og:url" content="{{CANONICAL}}">
  <meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{TITLE}}"><meta name="twitter:description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="application/ld+json">{{JSONLD}}</script>
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/assets/motion.js"></script>
</head>
<body data-route="{{ROUTE_KEY}}">
  <a class="skip-link" href="#main">本文へ移動</a>
  {{HEADER}}
  <main id="main">{{CONTENT}}</main>
  {{FOOTER}}
  <button class="ai-launcher" type="button" data-ai-launcher aria-expanded="false" aria-controls="customer-ai">案内AI</button>
  <section id="customer-ai" class="ai-bubble" hidden aria-label="Astera総合案内AI"><button type="button" data-ai-close>閉じる</button><p><strong>Astera総合案内AI</strong></p><p>公開情報に基づいて案内します。機微情報は入力しないでください。</p><a href="/chat/">Full Chatを開く</a></section>
</body></html>
